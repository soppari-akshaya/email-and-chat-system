services:
  - type: web
    name: connecthub
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k gthread --threads 50 -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: connecthub-db
          property: connectionString

databases:
  - name: connecthub-db
    databaseName: connecthub
    user: connecthub_user
    region: oregon
    plan: free

