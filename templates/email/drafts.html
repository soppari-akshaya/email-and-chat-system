
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drafts | ConnectHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4">Drafts</h2>

    <div class="list-group shadow-sm">
        {% for email in emails %}
            <div class="list-group-item">
                <strong>{{ email.subject or '(No subject)' }}</strong>
                <p class="mb-1 text-secondary">{{ email.body[:100] }}</p>
                <small class="text-muted">
                    Last saved: {{ email.created_at.strftime('%d %b %Y, %I:%M %p') }}
                </small>
            </div>
        {% else %}
            <div class="list-group-item text-center text-muted py-5">
                No saved drafts.
            </div>
        {% endfor %}
    </div>

    <a href="{{ url_for('email.compose') }}" class="btn btn-primary mt-4">Compose Email</a>
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary mt-4">Dashboard</a>
</div>

</body>
</html>
