
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ email.subject or 'Email' }} | ConnectHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 800px;">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">{{ email.subject or '(No subject)' }}</h4>
        </div>

        <div class="card-body">

            <p><strong>From:</strong> {{ email.sender.email }}</p>
            <p><strong>To:</strong> {{ email.recipient.email }}</p>

            <p class="text-muted">
                {{ email.created_at.strftime('%d %B %Y, %I:%M %p') }}
            </p>

            <hr>

            <div style="white-space: pre-wrap;">{{ email.body }}</div>

        </div>

        <div class="card-footer">
            <a href="{{ url_for('email.inbox') }}" class="btn btn-outline-secondary">Back to Inbox</a>
            <a href="{{ url_for('email.compose') }}" class="btn btn-primary">Compose</a>
        </div>

    </div>
</div>

</body>
</html>
